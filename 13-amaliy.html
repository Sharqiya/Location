<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Mobil moslashuvchan xarita</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body, html {  
    margin: 0;  
    padding: 0;  
    height: 100%;  
    width: 100%; 
    overflow: hidden;  
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
} 

#map {  
    height: 100vh; 
    width: 100%;  
} 

.locate-btn { 
    position: absolute; 
    bottom: 30px; 
    left: 50%; 
    transform: translateX(-50%); 
    z-index: 1000; 
    background: #007bff; 
    color: white; 
    padding: 18px 0; 
    border: none; 
    border-radius: 12px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
    font-size: 16px; 
    font-weight: bold; 
    width: 85%; 
    cursor: pointer; 
    transition: background 0.3s, transform 0.1s; 
    -webkit-tap-highlight-color: transparent; 
} 

.locate-btn:active { 
    background: #0056b3; 
    transform: translateX(-50%) scale(0.98); 
} 

@media (min-width: 768px) { 
    .locate-btn { 
        width: 300px; 
        bottom: 40px; 
        font-size: 14px; 
    } 
} 

.leaflet-touch .leaflet-bar a { 
    width: 44px; 
    height: 44px; 
    line-height: 44px; 
} 
</style>
</head>

<body>

<button class="locate-btn" onclick="findMe()">MENING JOYLASHUVIM</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Xarita
var map = L.map('map').setView([41.39, 60.44], 13);

// Tile layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
    attribution: '© OpenStreetMap' 
}).addTo(map);

// Nuqtalar (TO‘G‘RILANGAN)
var points = [ 
    { lat: 41.39, lng: 60.44, title: "Mening uyim" }, 
    { lat: 41.826574, lng: 60.480397, title: "Pizometr fermer - 1" }, 
    { lat: 41.727536, lng: 60.566810, title: "Pizometr fermer - 2" },
    { lat: 41.591559, lng: 60.552858, title: "Pizometr fermer - 3" },
    { lat: 41.507883, lng: 60.800865, title: "Pizometr fermer - 4" },
    { lat: 41.347991, lng: 60.542358, title: "Pizometr fermer - 5" },
    { lat: 41.383423, lng: 61.006464, title: "Pizometr fermer - 6" }
];

// Markerlar
points.forEach(function(point) { 
    L.marker([point.lat, point.lng]) 
        .addTo(map) 
        .bindPopup("<b>" + point.title + "</b>");
});

// Zoom joyi
map.zoomControl.setPosition('topright');

// User marker uchun
var myMarker, myCircle;

// Joylashuv
function findMe() { 
    map.locate({ 
        setView: true,  
        maxZoom: 16, 
        enableHighAccuracy: true 
    }); 
}

// Natija
map.on('locationfound', function(e) { 

    if (myMarker) map.removeLayer(myMarker);
    if (myCircle) map.removeLayer(myCircle);

    var radius = e.accuracy / 2; 

    myMarker = L.marker(e.latlng).addTo(map)
        .bindPopup("Hozir men turgan joy")
        .openPopup(); 

    myCircle = L.circle(e.latlng, radius).addTo(map); 
});

// Xatolik
map.on('locationerror', function() { 
    alert("Joylashuv aniqlanmadi"); 
});

</script>

</body>
</html>
